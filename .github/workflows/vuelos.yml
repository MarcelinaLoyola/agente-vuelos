name: Agente de vuelos
on:
  schedule:
    - cron: "0 */6 * * *"    # cada 6 horas
  push:
    paths: ["viajes.json"]   # al crear o borrar un viaje desde Telegram, busca enseguida
  workflow_dispatch: {}      # boton para ejecutarlo a mano
permissions:
  contents: write
concurrency:
  group: agente-vuelos       # nunca dos busquedas a la vez: se pisarian el estado
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # unos 4 minutos por viaje
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Buscar vuelos y avisar
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python buscador_vuelos.py
      - name: Guardar mejor precio
        run: |
          git config user.name "agente-vuelos"
          git config user.email "agente@users.noreply.github.com"
          git add estado_viajes.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza mejor precio"
            # El bot de Telegram tambien escribe en el repositorio (viajes.json)
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
